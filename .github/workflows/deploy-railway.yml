name: Deploy Railway

# Ordered deploy: backend (build -> pre-deploy migrations -> healthcheck) must be
# healthy before worker and frontend start. If any step fails, later services are
# not deployed and keep serving their previous (backward-compatible) version.
# Railway auto-deploy from GitHub must be disabled on backend, worker and frontend.

# Triggered by push (not workflow_run): workflow_run only fires for workflow files on
# the default branch (main), so it would never run for dev. CI is awaited in a step.
on:
  push:
    branches: [dev, main]

concurrency:
  group: deploy-railway-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy backend, worker, frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # dev -> staging, main -> production. Each GitHub Environment holds its own RAILWAY_TOKEN.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout pushed SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow ci.yml --commit "$HEAD_SHA" --event push --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          [ -n "$run_id" ] || { echo "::error::CI run not found for $HEAD_SHA"; exit 1; }
          gh run watch "$run_id" --exit-status

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.63.3

      - name: Deploy backend (migrations + healthcheck)
        run: ops/railway/deploy-service.sh backend "$RAILWAY_ENV" "$HEAD_SHA"

      - name: Deploy worker
        run: ops/railway/deploy-service.sh worker "$RAILWAY_ENV" "$HEAD_SHA"

      - name: Deploy frontend
        run: ops/railway/deploy-service.sh frontend "$RAILWAY_ENV" "$HEAD_SHA"
