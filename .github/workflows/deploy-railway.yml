name: Deploy Railway

# Ordered deploy: backend (build -> pre-deploy migrations -> healthcheck) must be
# healthy before worker and frontend start. If any step fails, later services are
# not deployed and keep serving their previous (backward-compatible) version.
# Railway auto-deploy from GitHub must be disabled on backend, worker and frontend.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [dev, main]

concurrency:
  group: deploy-railway-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy backend, worker, frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # dev -> staging, main -> production. Each GitHub Environment holds its own RAILWAY_TOKEN.
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_ENV: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout workflow_run SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.63.3

      - name: Deploy backend (migrations + healthcheck)
        run: ops/railway/deploy-service.sh backend "$RAILWAY_ENV" "$HEAD_SHA"

      - name: Deploy worker
        run: ops/railway/deploy-service.sh worker "$RAILWAY_ENV" "$HEAD_SHA"

      - name: Deploy frontend
        run: ops/railway/deploy-service.sh frontend "$RAILWAY_ENV" "$HEAD_SHA"
