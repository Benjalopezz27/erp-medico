# Escaneo de secretos — capa de CI (§8.2 del ASOME Engineering Manual).
# Dos capas, porque una se puede saltear: el hook local corre secretlint sobre lo staged
# y se evita con --no-verify; esta corre gitleaks sobre el historial y no se evita.
# Herramientas distintas a propósito: buscamos diversidad de detección, no potencia.
#
# Se usa el binario de gitleaks (MIT, gratis), no gitleaks-action: el wrapper de Action
# exige licencia paga para organizaciones.
name: secret-scan

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Escanear historial
        run: gitleaks git . --redact --verbose --exit-code 1
