name: Publish Container Images

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [dev, main]

concurrency:
  group: publish-images-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build, Scan & Publish Images
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout repository at workflow_run SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Image Tags & Target Names
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          BACKEND_TARGET="ghcr.io/${REPO_OWNER}/erp-medico-backend"
          FRONTEND_TARGET="ghcr.io/${REPO_OWNER}/erp-medico-frontend"

          echo "repo_owner=${REPO_OWNER}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_target=${BACKEND_TARGET}" >> "$GITHUB_OUTPUT"
          echo "frontend_target=${FRONTEND_TARGET}" >> "$GITHUB_OUTPUT"
          echo "backend_sha_tag=${BACKEND_TARGET}:sha-${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_sha_tag=${FRONTEND_TARGET}:sha-${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Backend Container Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: apps/backend/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.backend_sha_tag }}
          build-args: |
            APP_VERSION=${{ github.event.workflow_run.head_branch }}
            APP_COMMIT_SHA=${{ steps.meta.outputs.head_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build Frontend Container Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: apps/frontend/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.frontend_sha_tag }}
          build-args: |
            VITE_API_URL=/api/v1
            APP_VERSION=${{ github.event.workflow_run.head_branch }}
            APP_COMMIT_SHA=${{ steps.meta.outputs.head_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan Repository for Secrets and Misconfigurations
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret,misconfig'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner on Backend Image
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ steps.meta.outputs.backend_sha_tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner on Frontend Image
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ steps.meta.outputs.frontend_sha_tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Execute Automated Compose Smoke Test
        env:
          BACKEND_IMAGE: ${{ steps.meta.outputs.backend_sha_tag }}
          FRONTEND_IMAGE: ${{ steps.meta.outputs.frontend_sha_tag }}
          DB_PASSWORD: test_ci_database_password_smoke
          JWT_SECRET: test_ci_jwt_secret_key_minimum_32_characters_long!
        run: |
          set -euo pipefail

          cleanup() {
            docker compose -p erp_ci_smoke -f docker-compose.prod.yml down -v --remove-orphans || true
          }
          dump_logs() {
            echo "=== COMPOSE LOGS ON SMOKE FAILURE ==="
            docker compose -p erp_ci_smoke -f docker-compose.prod.yml logs || true
          }
          trap dump_logs ERR
          trap cleanup EXIT

          # 1. Validate compose configuration
          docker compose -p erp_ci_smoke -f docker-compose.prod.yml config --quiet

          # 2. Pull dependency images and boot dependencies first
          docker compose -p erp_ci_smoke -f docker-compose.prod.yml pull postgres redis
          docker compose -p erp_ci_smoke -f docker-compose.prod.yml up -d postgres redis

          # 3. Execute one-shot migration profile
          docker compose -p erp_ci_smoke -f docker-compose.prod.yml run --rm migration

          # 4. Boot backend and frontend
          docker compose -p erp_ci_smoke -f docker-compose.prod.yml up -d backend frontend

          # 5. Wait for frontend and backend health
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8080/api/v1/health | grep -q "ok"; do sleep 2; done'

          # 6. Verify non-root execution
          backend_user=$(docker inspect --format '{{.Config.User}}' $(docker compose -p erp_ci_smoke -f docker-compose.prod.yml ps -q backend))
          frontend_user=$(docker inspect --format '{{.Config.User}}' $(docker compose -p erp_ci_smoke -f docker-compose.prod.yml ps -q frontend))
          echo "Backend User: $backend_user"
          echo "Frontend User: $frontend_user"
          [ "$backend_user" = "appuser:appgroup" ] || [ "$backend_user" = "appuser" ] || [ "$backend_user" = "10001" ]
          [ "$frontend_user" = "nginx" ] || [ "$frontend_user" = "101" ]

          # 7. Verify databases have NO host ports exposed
          [ -z "$(docker compose -p erp_ci_smoke -f docker-compose.prod.yml port postgres 5432 2>/dev/null || true)" ]
          [ -z "$(docker compose -p erp_ci_smoke -f docker-compose.prod.yml port redis 6379 2>/dev/null || true)" ]

          # 8. Verify SHA and version endpoint
          health_res=$(curl -sf http://127.0.0.1:8080/api/v1/health)
          echo "$health_res" | grep -q "${{ steps.meta.outputs.head_sha }}"

          # 9. Verify SPA fallback and deterministic frontend metadata
          curl -sf http://127.0.0.1:8080/stock/quarantine | grep -q '<div id="root">'
          curl -sf http://127.0.0.1:8080/version.json | grep -q "${{ steps.meta.outputs.head_sha }}"

      - name: Push Container Images to GHCR
        run: |
          BACKEND_TARGET="${{ steps.meta.outputs.backend_target }}"
          FRONTEND_TARGET="${{ steps.meta.outputs.frontend_target }}"
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          HEAD_SHA="${{ steps.meta.outputs.head_sha }}"

          # Push immutable SHA tags
          docker push "${BACKEND_TARGET}:sha-${HEAD_SHA}"
          docker push "${FRONTEND_TARGET}:sha-${HEAD_SHA}"

          # Tag and push branch convenience alias
          if [ "$HEAD_BRANCH" = "main" ]; then
            docker tag "${BACKEND_TARGET}:sha-${HEAD_SHA}" "${BACKEND_TARGET}:latest"
            docker tag "${FRONTEND_TARGET}:sha-${HEAD_SHA}" "${FRONTEND_TARGET}:latest"
            docker push "${BACKEND_TARGET}:latest"
            docker push "${FRONTEND_TARGET}:latest"
          elif [ "$HEAD_BRANCH" = "dev" ]; then
            docker tag "${BACKEND_TARGET}:sha-${HEAD_SHA}" "${BACKEND_TARGET}:dev"
            docker tag "${FRONTEND_TARGET}:sha-${HEAD_SHA}" "${FRONTEND_TARGET}:dev"
            docker push "${BACKEND_TARGET}:dev"
            docker push "${FRONTEND_TARGET}:dev"
          fi

      - name: Extract Image Digests & Generate Release Manifest
        id: manifest
        run: |
          BACKEND_SHA_TAG="${{ steps.meta.outputs.backend_sha_tag }}"
          FRONTEND_SHA_TAG="${{ steps.meta.outputs.frontend_sha_tag }}"
          HEAD_SHA="${{ steps.meta.outputs.head_sha }}"
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Inspect repo digests after push
          BACKEND_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$BACKEND_SHA_TAG")
          FRONTEND_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$FRONTEND_SHA_TAG")

          echo "Backend Digest: $BACKEND_DIGEST"
          echo "Frontend Digest: $FRONTEND_DIGEST"

          # Write release manifest JSON
          cat <<EOF > release-manifest.json
          {
            "commitSha": "${HEAD_SHA}",
            "gitRef": "refs/heads/${HEAD_BRANCH}",
            "timestamp": "${TIMESTAMP}",
            "backendImage": "${BACKEND_DIGEST}",
            "frontendImage": "${FRONTEND_DIGEST}",
            "backendTag": "${BACKEND_SHA_TAG}",
            "frontendTag": "${FRONTEND_SHA_TAG}"
          }
          EOF

          # Verify manifest formatting
          jq . release-manifest.json

          # Output Step Summary
          echo "### 🚀 GHCR Container Publication Succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit SHA**: \`${HEAD_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Git Ref**: \`refs/heads/${HEAD_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Backend Image**: \`${BACKEND_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Frontend Image**: \`${FRONTEND_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release Manifest Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba5703 # v4.6.1
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 30
