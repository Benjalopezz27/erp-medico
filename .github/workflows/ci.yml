name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.32.1

      - name: Setup Node.js (24.x)
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        run: pnpm run format:check

      - name: Run linter (ESLint)
        run: pnpm -r run lint

  test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.11-alpine3.21@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.32.1

      - name: Setup Node.js (24.x)
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace types
        run: pnpm --filter @erp/shared-types run build

      - name: Run Backend Unit Tests
        run: pnpm --filter @erp/backend run test:cov
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: erp_user
          DB_PASSWORD: erp_pass
          DB_NAME: erp_test
          JWT_SECRET: 'test_ci_jwt_secret_key_minimum_32_characters_long!'
          JWT_EXPIRATION: '8h'
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SEED_ADMIN_PASSWORD: TestAdminPassword123!
          SEED_VENDEDOR_PASSWORD: TestVendedorPassword123!
          ARCA_ENV: development

      - name: Run Backend E2E Tests
        run: pnpm --filter @erp/backend run test:e2e
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: erp_user
          DB_PASSWORD: erp_pass
          DB_NAME: erp_test
          JWT_SECRET: 'test_ci_jwt_secret_key_minimum_32_characters_long!'
          JWT_EXPIRATION: '8h'
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SEED_ADMIN_PASSWORD: TestAdminPassword123!
          SEED_VENDEDOR_PASSWORD: TestVendedorPassword123!
          ARCA_ENV: development

  frontend-test:
    name: Frontend Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.32.1

      - name: Setup Node.js (24.x)
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Tests
        run: pnpm --filter @erp/frontend run test:run
        env:
          VITE_API_URL: 'http://localhost:3000/api/v1'

  build:
    name: Build All Workspace Packages
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, frontend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.32.1

      - name: Setup Node.js (24.x)
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm -r run build
