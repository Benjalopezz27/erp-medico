name: Verify Railway Production

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: 'Railway frontend URL, including https://'
        required: true
        type: string
      commit_sha:
        description: 'Commit SHA expected in backend and frontend metadata'
        required: true
        type: string

concurrency:
  group: verify-railway-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Run external production smoke tests
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ inputs.production_url }}
    steps:
      - name: Checkout expected revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Validate inputs
        env:
          PRODUCTION_URL: ${{ inputs.production_url }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$PRODUCTION_URL" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]] || {
            echo "::error::production_url must be an HTTPS origin without a path"
            exit 1
          }
          [[ "$COMMIT_SHA" =~ ^[a-f0-9]{7,40}$ ]] || {
            echo "::error::commit_sha must be a 7 to 40 character hexadecimal Git SHA"
            exit 1
          }

      - name: Run HTTPS smoke suite
        env:
          PRODUCTION_URL: ${{ inputs.production_url }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: bash scripts/smoke-test-production.sh "$PRODUCTION_URL" "$COMMIT_SHA"
